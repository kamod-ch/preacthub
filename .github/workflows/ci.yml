name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PreactHub
        uses: actions/checkout@v4
        with:
          path: preacthub

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preacthub/package-lock.json

      - name: Install PreactHub dependencies
        working-directory: preacthub
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: preacthub
        run: npm run lint

      - name: Typecheck
        working-directory: preacthub
        run: npm run typecheck

      - name: Test
        working-directory: preacthub
        run: npm run test

      - name: Validate catalog
        working-directory: preacthub
        run: npm run validate:catalog

      - name: Check routes
        working-directory: preacthub
        run: npm run check

      - name: Build
        working-directory: preacthub
        run: npm run build
        env:
          PREACTHUB_SITE_URL: https://preacthub.com
          PREACTPRESS_INCLUDE_MATOMO: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
