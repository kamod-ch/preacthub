name: Deploy to all-inkl

# Manual fallback when you need a deploy without waiting for CI, or to redeploy
# the current branch without a new push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-inkl-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://preacthub.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check
        run: pnpm run check

      - name: Build for preacthub.com
        run: pnpm run build
        env:
          PREACTHUB_SITE_URL: https://preacthub.com
          PREACTPRESS_INCLUDE_MATOMO: "true"

      - name: Install deployment client
        run: sudo apt-get install -y lftp

      - name: Deploy dist/ via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: bash scripts/deploy-all-inkl-ftps.sh
