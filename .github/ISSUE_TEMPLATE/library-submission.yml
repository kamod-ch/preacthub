name: Library submission
description: Suggest a library for the PreactHub directory
title: "Library submission: "
labels: [library-submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a library. Read the [PreactHub methodology](https://preacthub.com/methodology) before claiming a compatibility status.
        Only select quality badges when you can point to evidence.
  - type: input
    id: library-name
    attributes:
      label: Project name
      placeholder: e.g. Preact Signals
    validations:
      required: true
  - type: input
    id: package-name
    attributes:
      label: Package name
      placeholder: e.g. @preact/signals
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/org/repo
    validations:
      required: true
  - type: input
    id: documentation
    attributes:
      label: Documentation URL
      placeholder: https://example.com/docs
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - ui
        - state-management
        - data-fetching
        - routing
        - forms
        - testing
        - ssr
        - animation
        - i18n
        - charts
        - developer-tools
    validations:
      required: true
  - type: dropdown
    id: compatibility-status
    attributes:
      label: Claimed compatibility status
      description: See https://preacthub.com/methodology for definitions.
      options:
        - native
        - compat
        - community-tested
        - experimental
        - unverified
        - inactive
    validations:
      required: true
  - type: input
    id: tested-preact-version
    attributes:
      label: Tested Preact version
      placeholder: e.g. 10.26.x
  - type: textarea
    id: explanation
    attributes:
      label: Short explanation
      description: Why should this library be listed? Mention tested setup, SSR/islands notes and known limitations.
    validations:
      required: true
  - type: checkboxes
    id: is-maintainer
    attributes:
      label: Maintainer confirmation
      options:
        - label: I am a maintainer or regular contributor of this project
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
  - type: input
    id: example-repository
    attributes:
      label: Example repository
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
